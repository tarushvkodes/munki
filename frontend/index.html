<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Munki: the study app that opens like a feed, not a chore. Real SM-2 spaced repetition over real course content, gamified without punishment.">
<meta name="theme-color" content="#0b0e15">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐵</text></svg>">
<title>Munki · your study feed</title>
<link rel="stylesheet" href="/static/styles.css">
<link rel="stylesheet" href="/static/css/views.css">
<link rel="stylesheet" href="/static/css/drop.css">
<link rel="modulepreload" href="/static/js/lib.js">
<link rel="modulepreload" href="/static/js/motion.js">
<link rel="modulepreload" href="/static/js/fx.js">
<link rel="modulepreload" href="/static/js/stack.js">
<link rel="modulepreload" href="/static/js/rewards.js">
<link rel="modulepreload" href="/static/js/views/feed.js">
<script type="module" src="/static/app.js"></script>
</head>
<body>
<div class="ambient" aria-hidden="true"><i></i><i></i><i></i></div>

<header class="topbar">
  <div class="brand" aria-label="Munki">🐵 <span>Munki</span></div>
  <nav class="tabs" aria-label="Sections" data-hook="tabs">
    <button class="tab active" data-view="feed" data-hook="tab-feed" aria-current="page"><b aria-hidden="true">🃏</b><span>Feed</span></button>
    <button class="tab" data-view="drop" data-hook="tab-drop"><b aria-hidden="true">📥</b><span>Drop</span></button>
    <button class="tab" data-view="blitz" data-hook="tab-blitz"><b aria-hidden="true">⚡</b><span>Blitz</span></button>
    <button class="tab" data-view="lab" data-hook="tab-lab"><b aria-hidden="true">🧪</b><span>Lab</span></button>
    <button class="tab" data-view="decks" data-hook="tab-decks"><b aria-hidden="true">📚</b><span>Decks</span></button>
    <button class="tab" data-view="plan" data-hook="tab-plan"><b aria-hidden="true">🗓️</b><span>Plan</span></button>
    <i class="tab-ink" aria-hidden="true"></i>
  </nav>
  <div class="hud" id="hud" data-hook="hud">
    <div class="hud-level" id="hud-level" data-hook="level" title="Level"><small>LV</small><b id="hud-level-num">1</b></div>
    <div class="hud-xp" id="hud-xp-wrap" data-hook="xp-counter" title="Total XP"><b id="hud-xp">0</b><small>XP</small></div>
    <div class="hud-combo" id="hud-combo" data-hook="combo-meter" data-tier="1" title="Combo">
      <span class="combo-mult" id="combo-mult">×1</span>
      <span class="combo-track"><i id="combo-fill"></i></span>
      <span class="combo-count" id="combo-count">0</span>
    </div>
    <div class="hud-streak" id="hud-streak" data-hook="streak" title="Day streak"><span class="flame" aria-hidden="true">🔥</span><b id="hud-streak-num">0</b></div>
    <button class="gear" id="gear" aria-label="Settings" aria-expanded="false" data-hook="settings">⚙︎</button>
  </div>
  <div class="xpbar" aria-hidden="true"><i id="xpfill" data-hook="xp-bar"></i></div>
  <div class="settings-pop" id="settings" hidden>
    <label><input type="checkbox" id="tgl-plain"> <span data-plain="Simple words">Plain language</span></label>
    <label><input type="checkbox" id="tgl-font"> <span>Dyslexia-friendly font</span></label>
    <label><input type="checkbox" id="tgl-sound"> <span>Sound (off by default)</span></label>
  </div>
</header>

<main id="main">
  <section id="view-feed" class="view active" data-view-name="feed"></section>
  <section id="view-drop" class="view" data-view-name="drop" hidden></section>
  <section id="view-blitz" class="view" data-view-name="blitz" hidden></section>
  <section id="view-lab" class="view" data-view-name="lab" hidden></section>
  <section id="view-decks" class="view" data-view-name="decks" hidden></section>
  <section id="view-plan" class="view" data-view-name="plan" hidden></section>
</main>

<canvas id="fx" aria-hidden="true"></canvas>
<div id="toasts" class="toasts" aria-live="polite" data-hook="toasts"></div>
<div id="levelup" class="levelup" hidden data-hook="levelup">
  <div class="lu-backdrop"></div>
  <div class="lu-rays" aria-hidden="true"></div>
  <div class="lu-card" role="dialog" aria-label="Level up">
    <div class="lu-kicker">LEVEL UP</div>
    <div class="lu-num" id="lu-num">2</div>
    <div class="lu-sub" id="lu-sub">Your brain just leveled. Keep the feed rolling.</div>
    <button class="btn primary lu-go" id="lu-go">Keep going</button>
  </div>
</div>
<div id="dropveil" class="dropveil" hidden aria-hidden="true"><div><b>📥</b><span>Drop it. Munki makes the deck.</span></div></div>
<div id="sr-live" class="sr-only" aria-live="polite"></div>
</body>
</html>
